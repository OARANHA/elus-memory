# ELUS Memory self-hosted Hindsight (private until authentication is configured)
services:
  hindsight:
    image: ${HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight:latest}
    restart: unless-stopped
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-openai}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-https://llm.chutes.ai/v1}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
      HINDSIGHT_CP_ACCESS_KEY: ${HINDSIGHT_CP_ACCESS_KEY:?Configure CP key in Portainer}
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY:?Configure tenant key in Portainer}
      HINDSIGHT_API_TENANT_EXTENSION: ${HINDSIGHT_API_TENANT_EXTENSION:-hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension}
      HINDSIGHT_CP_DATAPLANE_API_KEY: ${HINDSIGHT_CP_DATAPLANE_API_KEY:?Configure dataplane key in Portainer}
      HINDSIGHT_API_WORKER_ID: elus-memory-worker-1
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    networks:
      elus_internal:
      wandora_edge:
        aliases:
          - elus-memory-api
    # Intentionally no published ports until HTTPS and authentication are ready.
networks:
  elus_internal:
    driver: bridge
  wandora_edge:
    external: true
    name: wandora-edge
volumes:
  hindsight_data:
