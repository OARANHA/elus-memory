name: Import Hindsight upstream

on:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ELUS Memory
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import upstream files without replacing ELUS metadata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none https://github.com/vectorize-io/hindsight.git /tmp/hindsight-upstream
          echo "Upstream commit: $(git -C /tmp/hindsight-upstream rev-parse HEAD)"
          rsync -a --exclude='.git/' --exclude='.github/workflows/' --exclude='deploy/elus/' /tmp/hindsight-upstream/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import upstream Hindsight source"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
