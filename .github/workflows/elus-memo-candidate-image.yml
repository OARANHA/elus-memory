name: ELUS Memory candidate image

on:
  push:
    branches:
      - feat/elus-memo-ai-cost-card-20261025
    paths:
      - "hindsight-control-plane/**"
      - "hindsight-clients/typescript/**"
      - "hindsight-api-slim/**"
      - "docker/standalone/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/elus-memo-candidate-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/standalone/Dockerfile
          target: standalone
          push: true
          build-args: |
            PRELOAD_ML_MODELS=false
            INCLUDE_LOCAL_MODELS=true
          tags: ghcr.io/oaranha/elus-memory:candidate-${{ github.sha }}
          cache-from: type=gha,scope=elus-memory-standalone
          cache-to: type=gha,scope=elus-memory-standalone,mode=max
