name: ELUS Memo Ledger PostgreSQL Gate
on:
  pull_request:
    paths:
      - "deploy/elus/migrations/**"
      - "deploy/elus/tests/**"
      - "hindsight-api-slim/hindsight_api/alembic/versions/**"
      - ".github/workflows/elus-memo-ledger-postgres.yml"
  push:
    branches: [main]
    paths:
      - "deploy/elus/migrations/**"
      - "deploy/elus/tests/**"
      - ".github/workflows/elus-memo-ledger-postgres.yml"
permissions:
  contents: read
jobs:
  ledger-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: usage_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d usage_ledger_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical Alembic revision graph
        run: python3 deploy/elus/tests/check_alembic_heads.py
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Install isolated migration test driver
        run: python3 -m pip install --break-system-packages psycopg2-binary
      - name: Execute Alembic upgrade and downgrade on isolated PostgreSQL
        run: python3 deploy/elus/tests/test_alembic_ledger.py
      - name: Real PostgreSQL transactional ledger smoke
        env:
          PGPASSWORD: test-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d usage_ledger_test -f deploy/elus/tests/usage_ledger.pg.sql
