name: Build ELUS Memory MCP gateway (staging)
on:
  push:
    branches: [main]
    paths:
      - "deploy/elus/mcp-gateway/**"
      - ".github/workflows/build-elus-mcp-gateway.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check gateway syntax
        run: node --check deploy/elus/mcp-gateway/server.mjs
      - name: Install and audit production dependencies
        working-directory: deploy/elus/mcp-gateway
        run: |
          npm install --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Run isolated gateway security smoke tests
        working-directory: deploy/elus/mcp-gateway
        run: npm test
      - name: Build Docker image
        run: docker build -t ghcr.io/oaranha/elus-memory-mcp-gateway:sha-${{ github.sha }} deploy/elus/mcp-gateway
      - name: Verify image works as unprivileged node user
        run: |
          docker run --rm --entrypoint node ghcr.io/oaranha/elus-memory-mcp-gateway:sha-${{ github.sha }} --check /app/server.mjs
      - name: Save staging image artifact
        run: docker save ghcr.io/oaranha/elus-memory-mcp-gateway:sha-${{ github.sha }} | gzip > elus-memory-mcp-gateway.tar.gz
      - name: Upload tested staging image artifact
        uses: actions/upload-artifact@v4
        with:
          name: elus-memory-mcp-gateway-${{ github.sha }}
          path: elus-memory-mcp-gateway.tar.gz
          retention-days: 7
